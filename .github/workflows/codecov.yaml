# Coverage report for the fork (course assignment, not part of upstream Apicurio).
# Builds the app module, runs BranchesTest + SqlBranchRepositoryTest with JaCoCo
# and uploads the report to Codecov.
name: Coverage (Codecov)

on:
  push:
    branches:
      - devops/codecov
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: JaCoCo + Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build app and its modules (no tests)
        run: ./mvnw -B -Dlocal -DskipTests -pl app -am install

      - name: Run tests with JaCoCo
        run: >
          ./mvnw -B -pl app
          org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:0.8.13:report
          -Dtest=BranchesTest,SqlBranchRepositoryTest
          -Dquarkus.kubernetes-client.devservices.enabled=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/target/site/jacoco/jacoco.xml
          flags: app
          fail_ci_if_error: true

      - name: Keep the HTML report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: warn
